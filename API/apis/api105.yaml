components:
  schemas:
    User:
      type: object
      properties:
        username:
          type: string

        password:
          type: string
          format: password
        email:
          type: string

        first_name:
          type: string
        last_name:
          type: string
        admin:
          type: boolean
        disabled:
          type: boolean
        last_signed:
          type: string
          format: date
        notification:
          type: boolean
        user-notification-setting:
          type: string
    UserSetting:
      type: object
      properties:
        notification:
          type: boolean
        pot_watering_notification:
          type: boolean
        low_moisture_notification:
          type: boolean
        plant_watering_schedule_notification_10min:
          type: boolean
        pot_watering_schedule_notification_10min:
          type: boolean
        low_temperature_notification:
          type: integer
        low_soil_temperature_notification:
          type: integer
    Pot:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        PotType_id:
          type: integer
    Plant:
      type: object
      properties:
        id:
          type: integer
        pot_id:
          type: integer
        name:
          type: string
        description:
          type: string
        position:
          type: integer
    Sensor:
      type: object
      properties:
        id:
          type: integer
        Pot_id:
          type: integer
        sensor_tag:
          type: string

        sensor_type:
          type: string
    PotType:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        capacity:
          type: integer
    Command:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        state:
          type: string
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        created_by:
          type: integer
        pot_id:
          type: integer
    Rule:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        criteria:
          type: string
        Pot_id:
          type: integer

    PotTypeList:
      type: array
      items:
        $ref: '#/components/schemas/PotType'
    UserList: 
      type: array
      items: 
        $ref: '#/components/schemas/User'
    UserSettingList:
      type: array
      items: 
        $ref: '#/components/schemas/UserSetting'
    PotList:
      type: array
      items:
        $ref: '#/components/schemas/Pot'
    PlantList:
      type: array
      items:
        $ref: '#/components/schemas/Plant'
    SensorList:
      type: array
      items:
        $ref: '#/components/schemas/Sensor'
    CommandList:
      type: array
      items:
        $ref: '#/components/schemas/Command'
    RuleList:
      type: array
      items:
        $ref: '#/components/schemas/Rule'

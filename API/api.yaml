openapi: 3.0.0
info:
  title: awmps-api
  version: 1.0.4
paths:
  /pot_types:
    get:
      summary: Get a list of all pot types
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/pot_type'
    post:
      summary: Create a new pot type
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/pot_type'
      responses:
        '201':
          description: Pot Type created successfully
  /pot_types/{id}:
    get:
      summary: Get details of a specific pot type
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pot_type'
    put:
      summary: Update a specific pot type
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/pot_type'
      responses:
        '200':
          description: Pot Type updated successfully
    delete:
      summary: Delete a specific pot type
      responses:
        '204':
          description: Pot Type deleted successfully

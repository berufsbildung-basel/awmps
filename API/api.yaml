components:
  schemas:
    users:
      properties:
        password:
          type: string
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: integer
        disabled:
          type: boolean
        last_signed:
          type: string
          format: date
        User_setting:
          type: integer
    user_settings:
      properties:
        notification:
          type: boolean
        pot_watering_notification:
          type: boolean
        low_moisture_notification:
          type: boolean
        zone_watering_schedule_notification_10min:
          type: boolean
        pot_watering_schedule_notification_10min:
          type: boolean
        low_moisture_notification:
          type: int
        low_temperature_notification:
          type: int
        low_soil_temperature_notification:
          type: int
    pot:
      properties:
        name:
          type: string
        pot_type_id:
          type: integer
    zone:
      properties:
        pot_id:
          type: integer
        name:
          type: string
        description:
          type: string
        position:
          type: integer
    sensor:
      properties:
        pot_id:
          type: integer
        name:
          type: string
        sensor_type_id:
          type: integer
    pot_type:
      properties:
        name:
          type: string
        capacity:
          type: integer
    sensor_type:
      properties:
        type:
          type: string
    command:
      properties:
        water_pot_schedule:
          type: string
        duration_time_of_watering:
          type: string
          format: time
        pot_id:
          type: integer
    rule:
      properties:
        id:
          type: integer
          format: int64
          description: Primary key for Rule
        duration:
          type: string
        action:
          type: string
        schedule:
          type: string
        enabled:
          type: boolean
        rain_probability_min:
          type: integer
        rain_probability_max:
          type: integer
        humidity_min:
          type: integer
        humidity_max:
          type: integer
        lux_min:
          type: integer
        lux_max:
          type: integer
        pot_id:
          type: integer
        zone_id:
          type: string
    cookie:
      properties:
        sessionid:
          type: string
          description: Primary key for Cookie
        expiredate:
          type: string
          format: date
          description: Expiration date for the session
        admin:
          type: boolean
          description: Indicates whether the user is an admin or not

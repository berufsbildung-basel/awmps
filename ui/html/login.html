<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="https://use.typekit.net/uxn4nsd.css">
    <script src="/js/script_login.js" defer></script>
    <title>Sign in</title>
</head>
<body>
    <header><h1>AWMPS</h1></header>
    <div id="data-container" class="data-container"></div>
    <div class="wrapper">
        <div class="form-box login">
            <h2>Sign in</h2>
            <form action="#" id="loginForm" onsubmit="return validateForm()">
                <div class="input-box">
                    <input type="email" id="email" required>
                    <label>Email</label>
                </div>
                <div class="input-box">
                    <input type="password" id="myInput" required>
                    <span class="icon" onclick="myFunction()"><ion-icon name="eye-outline"></ion-icon></span>
                    <label>Password</label>
                </div>
                <button type="submit" class="btn">Sign in</button>
            </form>
        </div>
    </div>
    <div class="logo">
        <img src="/images/awmps_logo.png" alt="">
    </div>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>

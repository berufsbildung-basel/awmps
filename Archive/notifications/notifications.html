<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
    <link rel="stylesheet" href="notifications.css">
</head>
<body>
    <header><h1>AWMPS</h1></header>
    <h1 id="notifis">Notifications</h1>
    <div class="together">
        <div class="notifications">
            <label class="switch">
                <input type="checkbox">
                <span class="slider round"></span>
            </label>
            <h2 class="switch-text">Receive&nbsp;Notifications</h2>
        </div>
        <div class="notifications">
            <label class="switch">
                <input type="checkbox">
                <span class="slider round"></span>
            </label>
            <h2 class="switch-text">After&nbsp;Pot&nbsp;Section&nbsp;has&nbsp;been&nbsp;watered</h2>
        </div>
        <div class="notifications">
            <label class="switch">
                <input type="checkbox">
                <span class="slider round"></span>
            </label>
            <h2 class="switch-text">After&nbsp;Pot&nbsp;has&nbsp;been&nbsp;watered</h2>
        </div>
        <div class="notifications">
            <label class="switch">
                <input type="checkbox">
                <span class="slider round"></span>
            </label>
            <h2 class="switch-text">A&nbsp;pot's&nbsp;moisture&nbsp;is&nbsp;below<input class="input-value-field" id="text-1" type="number" min="0" max="100" required></h2><h2>%</h2>
        </div>
        <div class="notifications">
            <label class="switch">
                <input type="checkbox">
                <span class="slider round"></span>
            </label>
            <h2 class="switch-text">The&nbsp;air&nbsp;temperature&nbsp;is&nbsp;below&nbsp;<input class="input-value-field" id="text-2" type="number" min="-273" max="273" required></h2><h2>°C</h2>
        </div>
        <div class="notifications">
            <label class="switch">
                <input type="checkbox">
                <span class="slider round"></span>
            </label>
            <h2 class="switch-text">The&nbsp;soil&nbsp;temperature&nbsp;is&nbsp;below<input class="input-value-field" id="text-3" type="number" min="-273" max="273" required></h2><h2>°C</h2>
        </div>
    </div>
</body>
</html>
